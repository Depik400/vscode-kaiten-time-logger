name: Build VSIX Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Важно: добавляем права на создание релиза
permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build VSIX Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build VSIX package
        run: bunx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaiten-time-logger
          path: ./*.vsix
          if-no-files-found: error

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.vsix
          name: Release v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Kaiten Time Logger v${{ steps.get_version.outputs.VERSION }}
            
            ### Что нового:
            - Автоматическое логирование времени в Kaiten
            - Определение карточки из названия ветки
            - Просмотр уже залогированного времени
            - Выбор роли из списка
            - Информация о пользователе
            
            ### Установка:
            1. Скачайте файл `kaiten-time-logger-${{ steps.get_version.outputs.VERSION }}.vsix`
            2. В VS Code: `Extensions: Install from VSIX...`
            
            ### Полная документация:
            [README.md](https://github.com/Depik400/vscode-kaiten-time-logger/blob/main/README.md)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}