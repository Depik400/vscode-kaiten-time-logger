name: Build VSIX Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VSIX Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update version in package.json
        run: |
          # Обновляем версию в package.json
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
          echo "✅ Updated package.json version to ${{ steps.get_version.outputs.VERSION }}"

      - name: Install dependencies
        run: bun install

      - name: Build VSIX package
        run: bunx @vscode/vsce package

      - name: Rename VSIX file to include version
        run: |
          # Переименовываем файл, если нужно
          ls -la *.vsix
          # Файл уже должен иметь правильную версию из package.json

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaiten-time-logger-${{ steps.get_version.outputs.VERSION }}
          path: ./*.vsix
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.vsix
          name: Release v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Kaiten Time Logger v${{ steps.get_version.outputs.VERSION }}
            
            ### Что нового:
            - Логирование времени в Kaiten
            
            ### Установка:
            1. Скачайте `kaiten-time-logger-${{ steps.get_version.outputs.VERSION }}.vsix`
            2. В VS Code: Extensions → Install from VSIX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}